# construir-paquete.sh los descarga una vez a una cache y rechaza cualquier
# archivo cuyo SHA-256 no coincida.
#
# Si un enlace desaparece (Apache Lounge solo publica la ultima compilacion),
# el archivo sigue sirviendo desde la cache: guardela junto a los paquetes.
#
# WINDOWS 7: Apache y Visual C++ se fijan en la ultima generacion que todavia
# corre ahi. Apache VS17 2.4.66 ("Runs on: 7 SP1 ... Server 2025", segun su
# ReadMe) con Visual C++ 14.44 (VS2022; el enlace de Microsoft lleva la misma
# huella SHA-256). La compilacion VS18 de Apache Lounge dice textualmente "The
# binaries do not run on XP, 7 SP1 and 2003", y el Visual C++ 14.5x es de
# VS2026: los dos dejarian fuera a los clientes con Windows 7, que es el minimo
# soportado segun STACK.md.
#
# tipo: runtime = va dentro del paquete · herramienta = solo para armarlo
